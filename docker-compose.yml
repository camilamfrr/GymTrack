version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: gymtrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymtrack_user
      POSTGRES_PASSWORD: gymtrack_pass
      POSTGRES_DB: gymtrack_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: gymtrack-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gymtrack_user:gymtrack_pass@db:5432/gymtrack_db?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - db

volumes:
  pgdata:
