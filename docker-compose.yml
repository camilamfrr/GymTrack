version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: gymtrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymtrack_user
      POSTGRES_PASSWORD: gymtrack_pass
      POSTGRES_DB: gymtrack_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
